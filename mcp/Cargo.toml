[package]
name = "todomocop-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
todomocop-core = { path = "../core" }
rmcp = { version = "1.2", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
ureq = "3"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
chrono = "0.4"
