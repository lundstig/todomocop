[package]
name = "todomocop-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
todomocop-core = { path = "../core" }
todomocop-sync = { path = "../sync" }
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
serde_json = "1"
anyhow = "1"
ureq = "3"
dirs = "6"
colored = "3"
indicatif = "0.18"
